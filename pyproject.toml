[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipedream"
version = "0.1.0"
description = "An LLM-based compiler and runtime for data pipelines authored in natural language."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2",
    "pyarrow>=14",
    "duckdb>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110"]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
local-model = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
pipedream = "pipedream.cli:main"
pipedream-serve = "pipedream.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
