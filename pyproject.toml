[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipedream"
version = "0.1.0"
description = "An LLM-based compiler and runtime for data pipelines authored in natural language."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2",
    "pandas>=2",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pipedream = "pipedream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
